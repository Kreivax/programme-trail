<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programme trail &amp; vélo — 12 semaines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ─── Design tokens (brand) ─────────────────────────────── */
    :root {
      --ink:        #12263A;
      --sand:       #F4EFE6;
      --paper:      #FBFAF7;
      --text:       #24272A;
      --muted:      #687076;
      --sage:       #7D9A83;
      --sage-light: #E0EAE2;
      --sage-mid:   #5A7A60;
      --terra:      #D9824B;
      --terra-light:#FAE9D9;
      --terra-mid:  #B5622E;
      --mist:       #DCE8EA;
      --mist-mid:   #3D6A72;
      --border:     #DDD5C8;
      --warning:    #E8B86D;
      --risk:       #B85C4A;
      --risk-light: #F5E8E4;
      --shadow-soft: 0 8px 24px rgba(18,38,58,0.08);
      --shadow-hover:0 12px 32px rgba(18,38,58,0.12);

      /* widget variable bridge */
      --color-background-primary:   var(--paper);
      --color-background-secondary: rgba(212,203,191,0.22);
      --color-text-primary:   var(--text);
      --color-text-secondary: var(--muted);
      --color-border-secondary: var(--border);
      --color-border-tertiary:  rgba(221,213,200,0.55);
      --border-radius-lg: 20px;
      --border-radius-md: 12px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--sand);
      background-image: radial-gradient(rgba(18,38,58,0.032) 1px, transparent 1px);
      background-size: 18px 18px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding: clamp(1.25rem, 4vw, 2.5rem) clamp(0.875rem, 3vw, 1.5rem) 5rem;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      animation: rise 0.38s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .app { font-family: 'Inter', sans-serif; }

    /* ─── Header ─────────────────────────────────────────────── */
    .hdr {
      background: var(--ink);
      border-radius: 24px;
      padding: 22px 26px 20px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }
    .hdr::after {
      content: '';
      position: absolute;
      top: -40%; right: -10%;
      width: 340px; height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(125,154,131,.18) 0%, transparent 65%);
      pointer-events: none;
    }
    .hdr-t {
      font-family: 'Sora', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--paper);
      letter-spacing: -0.01em;
      position: relative;
    }
    .hdr-s {
      font-size: 11.5px;
      font-weight: 400;
      color: rgba(251,250,247,0.58);
      margin-top: 5px;
      letter-spacing: 0.01em;
      position: relative;
    }

    /* ─── Stats row ───────────────────────────────────────────── */
    .krow {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (max-width: 480px) { .krow { grid-template-columns: repeat(2,1fr); } }
    .kc {
      background: var(--paper);
      border-radius: 16px;
      padding: 12px 15px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
    }
    .kl {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }
    .kv {
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    /* ─── Tab nav ─────────────────────────────────────────────── */
    .nav {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      background: rgba(212,203,191,0.35);
      border-radius: 16px;
      padding: 4px;
    }
    .nt {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .nt:hover { background: rgba(251,250,247,0.7); color: var(--ink); }
    .nt.on {
      background: var(--paper);
      color: var(--ink);
      font-weight: 600;
      box-shadow: 0 1px 6px rgba(18,38,58,0.09);
    }

    /* ─── Panels ──────────────────────────────────────────────── */
    .pnl { display: none; }
    .pnl.on { display: block; animation: rise 0.22s cubic-bezier(0.16,1,0.3,1) both; }

    /* ─── Phase pills ──────────────────────────────────────────── */
    .phr { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .pb {
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.16s;
      box-shadow: 0 1px 3px rgba(18,38,58,0.04);
    }
    .pb:hover { background: var(--sand); color: var(--ink); }
    .pb.on    { background: var(--sage-light); color: var(--sage-mid); border-color: var(--sage); font-weight: 600; }
    .pb.on.b2 { background: var(--mist);       color: var(--mist-mid); border-color: #90BCC5; }
    .pb.on.b3 { background: var(--terra-light); color: var(--terra-mid); border-color: var(--terra); }

    /* ─── Phase banner ─────────────────────────────────────────── */
    .pban {
      border-radius: 16px;
      padding: 13px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-soft);
    }
    .pban-t {
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--paper);
      letter-spacing: -0.01em;
    }
    .pban-s { font-size: 11px; color: rgba(251,250,247,0.65); margin-top: 3px; }

    /* ─── Tables ───────────────────────────────────────────────── */
    .tw {
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      overflow-x: auto;
      box-shadow: var(--shadow-soft);
      background: var(--paper);
    }
    .tw table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      table-layout: fixed;
    }
    .tw thead tr th {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: rgba(251,250,247,0.90);
      padding: 9px 12px;
      text-align: left;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .tw td {
      padding: 9px 12px;
      color: var(--text);
      border-bottom: 1px solid rgba(221,213,200,0.55);
      vertical-align: top;
      line-height: 1.5;
    }
    .tw tr:last-child td { border-bottom: none; }
    .tw tr:nth-child(even) td { background: rgba(212,203,191,0.12); }

    /* ─── Badges ───────────────────────────────────────────────── */
    .bd {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin: 1px 2px 1px 0;
      white-space: nowrap;
      letter-spacing: 0.025em;
    }
    .bv { background: var(--mist);       color: #1D5060; }
    .bc { background: var(--sage-light); color: var(--sage-mid); }
    .br { background: #EAE8F2;           color: #3D3B62; }
    .bz { background: var(--terra-light);color: var(--terra-mid); }
    .bl { background: var(--risk-light); color: #7A2E22; }

    /* ─── Section heading ──────────────────────────────────────── */
    .sh {
      font-family: 'Sora', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 1.375rem 0 0.625rem;
    }

    /* ─── Note ─────────────────────────────────────────────────── */
    .note {
      font-size: 12px;
      color: var(--mist-mid);
      margin-top: 8px;
      padding: 10px 14px;
      background: var(--mist);
      border-radius: 12px;
      border: 1px solid rgba(144,188,197,0.4);
      line-height: 1.55;
    }

    /* ─── Timeline ──────────────────────────────────────────────── */
    .tl  { display: grid; gap: 14px; }
    .tlr { display: grid; grid-template-columns: 64px 1fr; }
    .tll { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 2px; }
    .tlw {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 600; color: var(--muted);
      text-align: center; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .tld { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--sand); flex-shrink: 0; }
    .tlln { width: 2px; flex: 1; min-height: 14px; opacity: 0.25; }
    .tlc  { padding-left: 12px; }
    .tlh  {
      font-family: 'Sora', sans-serif;
      font-size: 12px; font-weight: 600;
      border-radius: 10px; padding: 4px 12px;
      margin-bottom: 8px; display: inline-block; letter-spacing: -0.005em;
    }
    .tlp    { font-size: 12px; color: var(--muted); display: flex; gap: 7px; padding: 2px 0; line-height: 1.5; }
    .tlp.hi { color: var(--text); font-weight: 600; }

    /* ─── Adaptations ───────────────────────────────────────────── */
    .ai {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 15px;
      margin-bottom: 9px;
      box-shadow: 0 2px 8px rgba(18,38,58,0.04);
    }
    .at {
      font-family: 'Inter', sans-serif;
      font-size: 10.5px; font-weight: 600; color: var(--terra-mid);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .aa { font-size: 12px; color: var(--text); line-height: 1.55; }
  </style>
</head>

<div id="p-zones"   class="pnl"><div id="zn"></div></div>

</div>

</div>

];

const TC=['#12263A','#1D4A5A','#B5622E'];

function st(id,btn){
  document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nt').forEach(b=>b.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  btn.classList.add('on');
}
function sa(g,btn,ph){
  g.querySelectorAll('.pb').forEach(b=>b.classList.remove('on','b2','b3'));
  btn.classList.add('on');
  if(ph===2)btn.classList.add('b2');
  if(ph===3)btn.classList.add('b3');
}
function bg(bs){return bs.map(([k,v])=>`<span class="bd ${k}">${v}</span>`).join('');}

function rw(ph){
  const p=PH[ph-1],tc=TC[ph-1];
  let h=`<div class="pban" style="background:${p.col}"><div class="pban-t">${p.t}</div><div class="pban-s">${p.s}</div></div>`;
  h+=`<div class="tw"><table><thead><tr style="background:${tc}"><th style="width:58px">Jour</th><th style="width:74px">Créneau</th><th style="width:80px">Type</th><th>Activité</th><th style="width:150px">Détail</th></tr></thead><tbody>`;
  WK[ph].forEach(d=>{h+=`<tr><td style="font-weight:600">${d.d}</td><td style="font-size:11px;color:var(--muted)">${d.s}</td><td>${bg(d.b)}</td><td>${d.m}</td><td style="font-size:11px;color:var(--muted)">${d.x}</td></tr>`;});
  h+=`</tbody></table></div>`;
  document.getElementById('wc').innerHTML=h;
}
function sw(ph,btn){sa(btn.parentElement,btn,ph);rw(ph);}

function rzw(ph){
  const tc=TC[ph-1];
  let h=`<div class="sh">Séances Zwift H3 — phase ${ph}</div><div class="tw"><table><thead><tr style="background:${tc}"><th style="width:140px">Workout</th><th style="width:130px">Créneau</th><th style="width:60px">Durée</th><th>Description</th></tr></thead><tbody>`;
  ZW[ph].forEach(z=>{h+=`<tr><td style="font-weight:600">${z.n}</td><td style="font-size:11px">${z.w}</td><td><span class="bd bz">${z.d}</span></td><td style="font-size:11px">${z.i}</td></tr>`;});
  h+=`</tbody></table></div>`;
  document.getElementById('zc').innerHTML=h;
}
function sz(ph,btn){sa(btn.parentElement,btn,ph);rzw(ph);}

function rrf(ph){
  const tc=TC[ph-1];
  let h='';
  ['A','B'].forEach(s=>{
    const tit=s==='A'?'Séance A — Bas du corps + gainage':'Séance B — Haut du corps + gainage latéral';
    h+=`<div class="sh">${tit}</div><div class="tw"><table><thead><tr style="background:${tc}"><th style="width:150px">Exercice</th><th style="width:90px">Séries</th><th style="width:100px">Charge</th><th>Consigne</th></tr></thead><tbody>`;
    RF[ph][s].forEach(e=>{h+=`<tr><td style="font-weight:600">${e.e}</td><td>${e.s}</td><td style="font-size:11px">${e.c}</td><td style="font-size:11px">${e.n}</td></tr>`;});
    h+=`</tbody></table></div>`;
  });
  h+=`<div class="note">Règle de progression : si tu termines la dernière série avec 3-4 reps de réserve, augmenter de 2 kg. Si la technique flanche à la rep 8, descendre de 2 kg.</div>`;
  document.getElementById('rc').innerHTML=h;
}
function sr(ph,btn){sa(btn.parentElement,btn,ph);rrf(ph);}

function rtf(){
  document.getElementById('tc').innerHTML=TR.map((t,i)=>`
  <div class="tlr">
    <div class="tll">
      <div class="tlw">${t.w}</div>
      <div class="tld" style="background:${t.col}"></div>
      ${i<TR.length-1?`<div class="tlln" style="background:${t.col}"></div>`:''}
    </div>
    <div class="tlc">
      <div class="tlh" style="background:${t.bg};color:${t.tc}">${t.t}</div>
      ${t.pts.map(p=>`<div class="tlp${p.hi?' hi':''}"><span style="flex-shrink:0">${p.hi?'◆':'◇'}</span><span>${p.txt}</span></div>`).join('')}
    </div>
  </div>`).join('');
}

function rzn(){
  let h=`<div class="tw"><table style="table-layout:fixed"><thead><tr style="background:#12263A"><th style="width:38px">Zone</th><th style="width:120px">Nom</th><th style="width:95px">Vélo (% FTP)</th><th style="width:100px">CAP (% FC max)</th><th>Ressenti</th></tr></thead><tbody>`;
  ZONES.forEach(z=>{h+=`<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${z.col};margin-right:5px;vertical-align:middle"></span><strong>${z.z}</strong></td><td>${z.n}</td><td>${z.v}</td><td>${z.c}</td><td style="font-size:11px">${z.r}</td></tr>`;});
  h+=`</tbody></table></div><div class="note">Calibrage Zwift : effectuer le Ramp Test dès S1 — Workouts > FTP Tests > Ramp Test. Toutes les zones se règlent automatiquement.</div>`;
  document.getElementById('zn').innerHTML=h;
}

function rad(){
  document.getElementById('ac').innerHTML=AD.map(a=>`<div class="ai"><div class="at">Situation : ${a.t}</div><div class="aa">${a.a}</div></div>`).join('');
}

rw(1);rzw(1);rrf(1);rtf();rzn();rad();
